<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">

    <title>AI Model Test</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>

</head>

<body>

<h1>石头剪刀布 AI 测试</h1>

<p id="status">
网页已经打开，正在加载模型……
</p>

<input
    type="file"
    id="imageUpload"
    accept="image/*"
    disabled
>

<br><br>

<img
    id="preview"
    width="224"
    height="224"
    style="display:none; object-fit:cover;"
>

<h2>预测结果</h2>

<div id="result"></div>


<script>

let model;

async function start() {

    const status =
        document.getElementById("status");

    try {

        status.innerText =
            "TensorFlow.js 已加载，正在加载模型……";

        model = await tmImage.load(
            "./model.json",
            "./metadata.json"
        );

        status.innerText =
            "✅ 模型加载成功！请选择一张图片。";

        document.getElementById(
            "imageUpload"
        ).disabled = false;

    }

    catch (error) {

        console.error(error);

        status.innerText =
            "❌ 模型加载失败：" + error.message;

    }

}


document.getElementById(
    "imageUpload"
).addEventListener(
    "change",
    async function(event) {

        const file =
            event.target.files[0];

        if (!file) return;


        const image =
            document.getElementById(
                "preview"
            );


        image.src =
            URL.createObjectURL(file);

        image.style.display =
            "block";


        image.onload =
            async function() {

                try {

                    const predictions =
                        await model.predict(
                            image
                        );


                    const result =
                        document.getElementById(
                            "result"
                        );


                    result.innerHTML = "";


                    predictions.forEach(
                        prediction => {

                            const p =
                                document.createElement(
                                    "p"
                                );

                            p.innerText =
                                prediction.className
                                +
                                ": "
                                +
                                (
                                    prediction.probability
                                    * 100
                                ).toFixed(2)
                                +
                                "%";


                            result.appendChild(
                                p
                            );

                        }
                    );

                }

                catch (error) {

                    document.getElementById(
                        "result"
                    ).innerText =
                        "预测失败："
                        +
                        error.message;

                }

            };

    }
);


start();

</script>

</body>

</html>
