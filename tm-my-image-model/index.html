<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>石头剪刀布 AI 识别</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

    <!-- Teachable Machine Image -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            color: #666;
            margin-bottom: 25px;
        }

        #preview {
            display: none;
            width: 224px;
            height: 224px;
            object-fit: cover;
            margin: 25px auto;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        input {
            margin: 20px;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
        }

        .prediction {
            margin: 10px 0;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        #winner {
            font-size: 26px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✊ ✋ ✌️</h1>
    <h2>石头剪刀布 AI 识别</h2>

    <p id="status">正在加载 AI 模型...</p>

    <input
        type="file"
        id="imageUpload"
        accept="image/*"
        disabled
    >

    <br>

    <img id="preview" alt="上传的图片">

    <div id="winner"></div>

    <div id="result"></div>

</div>


<script>

let model;

// 这里 ./ 表示和 index.html 在同一个文件夹
const MODEL_URL = "./model.json";
const METADATA_URL = "./metadata.json";


// 加载模型
async function loadModel() {

    const status = document.getElementById("status");

    try {

        model = await tmImage.load(
            MODEL_URL,
            METADATA_URL
        );

        status.innerText = "✅ AI 模型加载成功！请选择一张图片。";

        document.getElementById("imageUpload").disabled = false;

        console.log("模型加载成功");

    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ 模型加载失败：" + error.message;

    }

}


// 用户选择图片
document
    .getElementById("imageUpload")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        const image = document.getElementById("preview");

        image.src = URL.createObjectURL(file);

        image.style.display = "block";

        image.onload = function() {

            predict(image);

        };

    });


// AI 预测
async function predict(image) {

    if (!model) {
        return;
    }

    const predictions = await model.predict(image);

    // 按概率从高到低排列
    predictions.sort(
        (a, b) => b.probability - a.probability
    );

    const winner =
        document.getElementById("winner");

    winner.innerHTML =
        "预测结果："
        + predictions[0].className
        + "（"
        + (predictions[0].probability * 100).toFixed(1)
        + "%）";


    const result =
        document.getElementById("result");

    result.innerHTML = "";


    predictions.forEach(prediction => {

        const div =
            document.createElement("div");

        div.className = "prediction";

        div.innerText =
            prediction.className
            + "："
            + (prediction.probability * 100).toFixed(1)
            + "%";

        result.appendChild(div);

    });

}


// 页面打开后加载模型
loadModel();

</script>

</body>
</html>
